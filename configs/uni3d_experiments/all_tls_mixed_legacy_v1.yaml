experiment:
  name: all_tls_mixed_legacy_v1
  description: "Historical 430-tree Uni3D embedding run with mixed xyz-only and semantic/discrete color availability."
  stage: "embedded"
  version: "v1"
  created_by: "manual"
  notes: "Legacy reference only. Do not overwrite outputs/all_tls_001."

paths:
  raw_las_dir: "/home/team-lu/harrison_workspace/data/forestagent/tls_las"
  npy_input_dir: "/home/team-lu/harrison_workspace/data/forestagent/uni3d_all_inputs_rgb"
  embedding_output_dir: "/home/team-lu/harrison_workspace/outputs/forestagent/uni3d_embeddings/all_tls_001"
  similarity_output_dir: "/home/team-lu/harrison_workspace/outputs/forestagent/uni3d_embeddings/all_tls_001_analysis_full"
  probe_output_dir: "/home/team-lu/harrison_workspace/outputs/forestagent/probe_strict/loso_round1"
  label_path: "data/parameters.xlsx"
  checkpoint_path: "/home/team-lu/harrison_workspace/checkpoints/Uni3D/modelzoo/uni3d-b/model.pt"
  uni3d_repo_path: "/home/team-lu/harrison_workspace/projects/Uni3D"

conversion:
  enabled: false
  output_mode: "legacy_mixed"
  color_policy: "mixed_historical"
  num_points: 10000
  seed: 42
  recursive: true
  pattern: "*.las"
  skip_existing: true
  overwrite: false
  semantic_color_likely: true
  natural_rgb: false
  limit: null

extractor:
  pc_model: "eva02_base_patch14_448"
  pc_feat_dim: 768
  embed_dim: 1024
  pc_encoder_dim: 512
  num_group: 512
  group_size: 64
  device: "cuda"
  yz_swap: false
  pattern: "*.npy"
  recursive: true
  skip_existing: true
  overwrite: false
  limit: null

analysis:
  similarity:
    top_k: 5
    max_samples: null
    seed: 42
    save_full_matrix: true
    no_full_matrix: false
  probe:
    tasks: ["all"]
    feature_sets: ["all"]
    splits: ["leave_one_site_out"]
    seeds: [0, 1, 2, 3, 4]
    exclude_near_duplicates: false
    exclude_outliers: false
    rgb_source: "all"

metadata:
  expected_sample_count: 430
  current_status: "historical_reference"
  mixed_rgb_availability: true
  interpretability_warning: true
  warning: "Mixed RGB/color availability is site-confounded and should be treated as a historical baseline, not a clean ablation."

